<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寒冷地1泊旅行 持ち物チェックリスト</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen py-8 px-4 sm:px-6">
    <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-lg overflow-hidden border border-slate-100">
        <!-- Header -->
        <div class="bg-gradient-to-r from-sky-700 to-indigo-800 text-white p-6 sm:p-8">
            <h1 class="text-2xl sm:text-3xl font-bold mb-2">🧥 寒冷地 1泊旅行チェックリスト</h1>
            <p class="text-sky-100 text-sm sm:text-base">標高の高い場所や寒い地域への旅行・雨天対策に特化した持ち物リストです。準備のチェックにお使いください！</p>
        </div>

        <!-- Content -->
        <div class="p-6 sm:p-8 space-y-8">
            <!-- 衣類・防寒着 -->
            <section>
                <h2 class="text-lg font-semibold text-sky-900 border-b border-sky-100 pb-2 mb-4 flex items-center gap-2">
                    <span>🧣</span> 衣類・防寒着（重ね着・体温調節重視）
                </h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <label class="flex items-center space-x-3 p-3 rounded-xl hover:bg-slate-50 border border-slate-200 cursor-pointer transition">
                        <input type="checkbox" class="w-5 h-5 text-sky-600 rounded focus:ring-sky-500">
                        <span class="text-sm font-medium">アウター（防風・防水マウンテンパーカー等）</span>
                    </label>
                    <label class="flex items-center space-x-3 p-3 rounded-xl hover:bg-slate-50 border border-slate-200 cursor-pointer transition">
                        <input type="checkbox" class="w-5 h-5 text-sky-600 rounded focus:ring-sky-500">
                        <span class="text-sm font-medium">中間着（フリース・セーター・インナーダウン）</span>
                    </label>
                    <label class="flex items-center space-x-3 p-3 rounded-xl hover:bg-slate-50 border border-slate-200 cursor-pointer transition">
                        <input type="checkbox" class="w-5 h-5 text-sky-600 rounded focus:ring-sky-500">
                        <span class="text-sm font-medium">長袖トップス（1泊分 ＋ 予備1枚）</span>
                    </label>
                    <label class="flex items-center space-x-3 p-3 rounded-xl hover:bg-slate-50 border border-slate-200 cursor-pointer transition">
                        <input type="checkbox" class="w-5 h-5 text-sky-600 rounded focus:ring-sky-500">
                        <span class="text-sm font-medium">ボトムス（動きやすく乾きやすいパンツ）</span>
                    </label>
                    <label class="flex items-center space-x-3 p-3 rounded-xl hover:bg-slate-50 border border-slate-200 cursor-pointer transition">
                        <input type="checkbox" class="w-5 h-5 text-sky-600 rounded focus:ring-sky-500">
                        <span class="text-sm font-medium">発熱・保温インナー（上下2セット）</span>
                    </label>
                    <label class="flex items-center space-x-3 p-3 rounded-xl hover:bg-slate-50 border border-slate-200 cursor-pointer transition">
                        <input type="checkbox" class="w-5 h-5 text-sky-600 rounded focus:ring-sky-500">
                        <span class="text-sm font-medium">靴下（厚手・防寒用を多めに）</span>
                    </label>
                    <label class="flex items-center space-x-3 p-3 rounded-xl hover:bg-slate-50 border border-slate-200 cursor-pointer transition">
                        <input type="checkbox" class="w-5 h-5 text-sky-600 rounded focus:ring-sky-500">
                        <span class="text-sm font-medium">パジャマ・部屋着（宿にない場合の防寒着）</span>
                    </label>
                    <label class="flex items-center space-x-3 p-3 rounded-xl hover:bg-slate-50 border border-slate-200 cursor-pointer transition">
                        <input type="checkbox" class="w-5 h-5 text-sky-600 rounded focus:ring-sky-500">
                        <span class="text-sm font-medium">下着・インナー類（1泊分 ＋ 予備）</span>
                    </label>
                </div>
            </section>

            <!-- 靴・防寒小物・雨対策 -->
            <section>
                <h2 class="text-lg font-semibold text-sky-900 border-b border-sky-100 pb-2 mb-4 flex items-center gap-2">
                    <span>☔</span> 靴・防寒小物・雨対策
                </h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <label class="flex items-center space-x-3 p-3 rounded-xl hover:bg-slate-50 border border-slate-200 cursor-pointer transition">
                        <input type="checkbox" class="w-5 h-5 text-sky-600 rounded focus:ring-sky-500">
                        <span class="text-sm font-medium">歩き慣れた防水スニーカー・トレッキングシューズ</span>
                    </label>
                    <label class="flex items-center space-x-3 p-3 rounded-xl hover:bg-slate-50 border border-slate-200 cursor-pointer transition">
                        <input type="checkbox" class="w-5 h-5 text-sky-600 rounded focus:ring-sky-500">
                        <span class="text-sm font-medium">マフラー・ストール・ネックウォーマー</span>
                    </label>
                    <label class="flex items-center space-x-3 p-3 rounded-xl hover:bg-slate-50 border border-slate-200 cursor-pointer transition">
                        <input type="checkbox" class="w-5 h-5 text-sky-600 rounded focus:ring-sky-500">
                        <span class="text-sm font-medium">手袋（できれば防風・防寒性のあるもの）</span>
                    </label>
                    <label class="flex items-center space-x-3 p-3 rounded-xl hover:bg-slate-50 border border-slate-200 cursor-pointer transition">
                        <input type="checkbox" class="w-5 h-5 text-sky-600 rounded focus:ring-sky-500">
                        <span class="text-sm font-medium">折りたたみ傘（強風対応の丈夫なもの）</span>
                    </label>
                    <label class="flex items-center space-x-3 p-3 rounded-xl hover:bg-slate-50 border border-slate-200 cursor-pointer transition">
                        <input type="checkbox" class="w-5 h-5 text-sky-600 rounded focus:ring-sky-500">
                        <span class="text-sm font-medium">リュック用レインカバー または 防水バック</span>
                    </label>
                    <label class="flex items-center space-x-3 p-3 rounded-xl hover:bg-slate-50 border border-slate-200 cursor-pointer transition">
                        <input type="checkbox" class="w-5 h-5 text-sky-600 rounded focus:ring-sky-500">
                        <span class="text-sm font-medium">使い捨てカイロ（貼る・貼らないタイプ）</span>
                    </label>
                </div>
            </section>

            <!-- 洗面用具・スキンケア・薬 -->
            <section>
                <h2 class="text-lg font-semibold text-sky-900 border-b border-sky-100 pb-2 mb-4 flex items-center gap-2">
                    <span>🧴</span> スキンケア・常備薬
                </h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <label class="flex items-center space-x-3 p-3 rounded-xl hover:bg-slate-50 border border-slate-200 cursor-pointer transition">
                        <input type="checkbox" class="w-5 h-5 text-sky-600 rounded focus:ring-sky-500">
                        <span class="text-sm font-medium">高保湿クリーム・リップクリーム（寒冷地は乾燥対策必須）</span>
                    </label>
                    <label class="flex items-center space-x-3 p-3 rounded-xl hover:bg-slate-50 border border-slate-200 cursor-pointer transition">
                        <input type="checkbox" class="w-5 h-5 text-sky-600 rounded focus:ring-sky-500">
                        <span class="text-sm font-medium">日焼け止め（標高が高いと紫外線が強い）</span>
                    </label>
                    <label class="flex items-center space-x-3 p-3 rounded-xl hover:bg-slate-50 border border-slate-200 cursor-pointer transition">
                        <input type="checkbox" class="w-5 h-5 text-sky-600 rounded focus:ring-sky-500">
                        <span class="text-sm font-medium">常備薬（胃薬、頭痛薬、酔い止め等）</span>
                    </label>
                    <label class="flex items-center space-x-3 p-3 rounded-xl hover:bg-slate-50 border border-slate-200 cursor-pointer transition">
                        <input type="checkbox" class="w-5 h-5 text-sky-600 rounded focus:ring-sky-500">
                        <span class="text-sm font-medium">歯ブラシセット・洗顔・メイク落とし</span>
                    </label>
                </div>
            </section>

            <!-- 電子機器・貴重品・その他 -->
            <section>
                <h2 class="text-lg font-semibold text-sky-900 border-b border-sky-100 pb-2 mb-4 flex items-center gap-2">
                    <span>📱</span> 電子機器・貴重品・その他
                </h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <label class="flex items-center space-x-3 p-3 rounded-xl hover:bg-slate-50 border border-slate-200 cursor-pointer transition">
                        <input type="checkbox" class="w-5 h-5 text-sky-600 rounded focus:ring-sky-500">
                        <span class="text-sm font-medium">スマートフォン ＆ 充電器</span>
                    </label>
                    <label class="flex items-center space-x-3 p-3 rounded-xl hover:bg-slate-50 border border-slate-200 cursor-pointer transition">
                        <input type="checkbox" class="w-5 h-5 text-sky-600 rounded focus:ring-sky-500">
                        <span class="text-sm font-medium">モバイルバッテリー（寒さで充電の減りが早いため）</span>
                    </label>
                    <label class="flex items-center space-x-3 p-3 rounded-xl hover:bg-slate-50 border border-slate-200 cursor-pointer transition">
                        <input type="checkbox" class="w-5 h-5 text-sky-600 rounded focus:ring-sky-500">
                        <span class="text-sm font-medium">財布（現金、クレジットカード、保険証）</span>
                    </label>
                    <label class="flex items-center space-x-3 p-3 rounded-xl hover:bg-slate-50 border border-slate-200 cursor-pointer transition">
                        <input type="checkbox" class="w-5 h-5 text-sky-600 rounded focus:ring-sky-500">
                        <span class="text-sm font-medium">ハンカチ・ウェットティッシュ・替えのマスク</span>
                    </label>
                    <label class="flex items-center space-x-3 p-3 rounded-xl hover:bg-slate-50 border border-slate-200 cursor-pointer transition">
                        <input type="checkbox" class="w-5 h-5 text-sky-600 rounded focus:ring-sky-500">
                        <span class="text-sm font-medium">ジップロック・ビニール袋（濡れた衣類やゴミ入れ用）</span>
                    </label>
                    <label class="flex items-center space-x-3 p-3 rounded-xl hover:bg-slate-50 border border-slate-200 cursor-pointer transition">
                        <input type="checkbox" class="w-5 h-5 text-sky-600 rounded focus:ring-sky-500">
                        <span class="text-sm font-medium">宿泊予約の控え（QRコードや画面メモ）</span>
                    </label>
                </div>
            </section>
        </div>

        <!-- Footer -->
        <div class="bg-slate-100 p-4 text-center text-xs text-slate-500 border-t border-slate-200">
            寒冷地旅行チェックリスト - 快適で安全なご旅行を！
        </div>
    </div>
</body>
</html>
