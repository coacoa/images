*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{

#frame{

header.top{display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; margin-bottom:10px}

.hbtns{display:flex; gap:6px; flex-wrap:wrap}
.hbtn{
  background:var(--btn); color:var(--ink); border:2px solid var(--border);

}
.hbtn:active{background:var(--btn-hi)}
#progress{font-size:13px; color:var(--dim); margin:0 0 8px}
#progress .marks{color:var(--accent); letter-spacing:.15em}
/* stage */
#stage{
  position:relative; border:3px solid var(--border); border-radius:4px;
  background:linear-gradient(#131a38 0%, #131a38 62%, #0a0d1d 62%, #0a0d1d 100%);
  min-height:300px; overflow:hidden;
}
#stage::after{ /* scanlines over scene only */
  content:""; position:absolute; inset:0; pointer-events:none; z-index:3;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px);
}
#diagPanel{
  position:relative; z-index:2; margin:10px auto 0; width:min(92%,520px);
  background:#0a1410; border:3px solid #5a4632; border-radius:3px; padding:8px;

}
#diagPanel.show{display:block}

#diagPanel svg{width:100%; height:auto; display:block}
.chars{position:absolute; left:0; right:0; bottom:6px; z-index:2; display:flex; justify-content:space-between; padding:0 18px; pointer-events:none}
.char{text-align:center}
.char svg{display:block; margin:0 auto}
.char .cname{font-size:12px; color:#fff; text-shadow:1px 1px 0 #000; margin-top:2px}
.char.dim{opacity:.45}
/* message box */
#msgbox{
  margin-top:10px; background:var(--panel); border:3px solid var(--border); border-radius:4px;
  padding:12px 14px; min-height:132px; position:relative;
}
#speaker{font-size:13px; color:var(--accent); margin-bottom:6px}
#msgtext{font-size:18px; line-height:1.65; white-space:pre-wrap; word-break:break-word; max-height:220px; overflow-y:auto}
#msgtext .cursor{color:var(--accent)}
#nextHint{position:absolute; right:10px; bottom:6px; font-size:12px; color:var(--dim); animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
/* choices */
#choices{margin-top:10px; display:none; gap:8px; flex-wrap:wrap}
#choices.show{display:flex}
#choices.diagmenu{flex-direction:row}
.choice{

}
.choice:active,.choice:hover{background:var(--btn-hi)}
.choice.small{border-color:var(--border); font-weight:normal}
/* footer + panels */
footer.foot{margin-top:12px; font-size:12px; color:var(--dim); line-height:1.6}
.panelbtn{
  width:100%; margin-top:10px; background:var(--btn); color:var(--ink);
  border:2px solid var(--border); border-radius:4px; font-size:14px; padding:8px;

#listenPanel,#gallery{display:none; margin-top:10px; border:2px solid var(--border); border-radius:4px; background:var(--panel); padding:12px}
#listenPanel.show,#gallery.show{display:block}
#listenPanel h2,#gallery h2{font-size:15px; margin:0 0 8px; color:var(--accent)}
.listen-item{font-size:14px; line-height:1.7; margin-bottom:10px; white-space:pre-wrap}

.lbtns{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px}
.lbtns button{background:var(--btn); color:#fff; border:2px solid var(--accent); border-radius:4px; padding:6px 14px; font-size:14px}
#listenStatus{font-size:13px; color:var(--dim); margin-bottom:8px}
#listenBarWrap{height:8px; background:#05070f; border:1px solid var(--border); border-radius:4px; overflow:hidden; margin-bottom:10px}
#listenBar{height:100%; width:0%; background:var(--accent)}

@media (max-width:560px){

}
@media (prefers-reduced-motion: reduce){

}

var SAVE_KEY="oobosuSaveV1", TTS_KEY="advTtsV1";
var save={done:[],cur:0};
try{var s=JSON.parse(localStorage.getItem(SAVE_KEY)||"null"); if(s&&s.done) save=s;}catch(e){}
while(save.done.length<LESSONS.length) save.done.push(false);

function persist(){ try{localStorage.setItem(SAVE_KEY, JSON.stringify(save));}catch(e){} }
function renderProgress(){
  var m="",doneCount=0;
  for(var i=0;i<LESSONS.length;i++){ m+= save.done[i]?"✓":"・"; if(save.done[i])doneCount++; }
  document.getElementById("marks").textContent=m;

/* ============ TTS ============ */
var ttsOn=false;
try{ ttsOn = localStorage.getItem(TTS_KEY)==="1"; }catch(e){}
var ttsBtn=document.getElementById("ttsBtn");
function ttsLabel(){
  var hasJa=false;
  try{ var vs=speechSynthesis.getVoices(); for(var i=0;i<vs.length;i++){ if(vs[i].lang&&vs[i].lang.indexOf("ja")===0){hasJa=true;break;} } }catch(e){}
  ttsBtn.textContent = ttsOn ? (hasJa?"🗣 読上ON":"🗣 読上ON（音声なし）") : "🗣 読上OFF";
}
function speak(text){
  if(!ttsOn) return;
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text.replace(/\n+/g,"。"));
    u.lang="ja-JP"; u.rate=1.0;
    var vs=speechSynthesis.getVoices();
    for(var i=0;i<vs.length;i++){ if(vs[i].lang&&vs[i].lang.indexOf("ja")===0){u.voice=vs[i];break;} }
    speechSynthesis.speak(u);
  }catch(e){}
}
ttsBtn.addEventListener("click",function(){
  ttsOn=!ttsOn;
  try{localStorage.setItem(TTS_KEY, ttsOn?"1":"0");}catch(e){}
  if(!ttsOn){ try{speechSynthesis.cancel();}catch(e){} }
  ttsLabel();
  if(ttsOn) speak(currentText);
});
if("speechSynthesis" in window){ speechSynthesis.onvoiceschanged=ttsLabel; }
ttsLabel();

var msgEl=document.getElementById("msgtext"), hintEl=document.getElementById("nextHint"),
    chEl=document.getElementById("choices"), diagPanel=document.getElementById("diagPanel"),
    diagBody=document.getElementById("diagBody"), diagTitle=document.getElementById("diagTitle"),
    spkEl=document.getElementById("speaker");
var currentText="", fullText="", typePos=0, typing=false;

function beep(freq,dur){
  try{
    var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    if(!beep.ctx) beep.ctx=new AC();
    var c=beep.ctx; if(c.state==="suspended") c.resume();
    var o=c.createOscillator(), g=c.createGain();
    o.type="square"; o.frequency.value=freq||660;
    g.gain.setValueAtTime(0.04,c.currentTime); g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+(dur||0.07));
    o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+(dur||0.07));
  }catch(e){}
}
function typewrite(text){
  fullText=text; currentText=text; typePos=0; typing=true;
  hintEl.style.display="none";
  if(typeTimer) clearInterval(typeTimer);
  typeTimer=setInterval(function(){
    typePos+=2;
    if(typePos>=fullText.length){ typePos=fullText.length; typing=false; clearInterval(typeTimer); onTyped(); }
    msgEl.textContent=fullText.slice(0,typePos);
    if(msgEl.scrollHeight>msgEl.clientHeight){
      var nearBottom = (msgEl.scrollTop + msgEl.clientHeight) > (msgEl.scrollHeight-140);
      if(nearBottom||typePos<60) msgEl.scrollTop=msgEl.scrollHeight;
    }
  },18);
  speak(text);
}
msgEl.parentElement.addEventListener("click",function(){
  if(typing){ if(typeTimer)clearInterval(typeTimer); typing=false; msgEl.textContent=fullText; onTyped(); }
});
function onTyped(){ if(phase==="explain"||phase==="supp"||phase==="why"){ showChoicesForPhase(); } else { hintEl.style.display="none"; } }

function setChoices(list, diag){
  chEl.innerHTML="";
  list.forEach(function(c){
    var b=document.createElement("button"); b.type="button"; b.className="choice"+(c.small?" small":"");
    b.textContent=c.label; b.addEventListener("click",function(){beep(520,.06); c.fn();});
    chEl.appendChild(b);
  });
  chEl.className="show"+(diag?" diagmenu":"");
}
function hideChoices(){ chEl.className=""; chEl.innerHTML=""; }

function showDiag(i){
  var d=DIAGS[i];
  diagTitle.textContent=d.t; diagBody.innerHTML=d.svg; diagPanel.classList.add("show");
}

function startLesson(i){
  idx=i; save.cur=i; persist(); renderProgress();
  var L=LESSONS[i];
  spkEl.textContent="ミナモト仙人 ― "+CHAPTERS[L.ch]+" ／ 第"+(i+1)+"課「"+L.title+"」"+(save.done[i]?" ✓":"");
  showDiag(i); hideChoices(); phase="explain";
  typewrite(L.body);
}
function showChoicesForPhase(){
  var L=LESSONS[idx];
  if(phase==="explain"){
    setChoices([
      {label:"✓ わかった", fn:goQuiz},
      {label:"？ わからない（補足を聞く）", small:true, fn:function(){ phase="supp"; hideChoices(); typewrite(L.supp+"\n\n――では、確認問題に進もう。"); }}
    ], true);
  } else if(phase==="supp"){
    setChoices([{label:"→ 確認問題へ", fn:goQuiz}], true);
  } else if(phase==="why"){
    setChoices([{label:"→ もう一度、確認問題", fn:goQuiz}], true);
  }
}
function goQuiz(){
  var L=LESSONS[idx]; phase="quiz"; hideChoices();
  spkEl.textContent="確認問題 ― 第"+(idx+1)+"課「"+L.title+"」";
  typewrite(L.q);
  var list=L.choices.map(function(c,ci){
    return {label:(ci+1)+". "+c, fn:function(){ answer(ci); }};
  });
  /* 問題文タイプ後に選択肢を出すため少し遅らせる */
  var iv=setInterval(function(){ if(!typing){ clearInterval(iv); if(phase==="quiz") setChoices(list,false); } },120);
}
function answer(ci){
  var L=LESSONS[idx];
  if(ci===L.answer){
    beep(880,.09); setTimeout(function(){beep(1320,.12);},110);
    save.done[idx]=true; persist(); renderProgress();
    phase="done"; hideChoices();
    if(idx>=LESSONS.length-1){
      spkEl.textContent="ミナモト仙人 ― 卒業";
      typewrite("正解じゃ。これで全8課、修了じゃ。\n\n争いのエネルギーは消えない。だが向きは変えられる。発生源は一つずつしかない。自分の手の届くところから掃除する ―― それを忘れんでくれ。\n\n（最初から読み直すこともできます）");
      setChoices([{label:"↺ 最初から読み直す", small:true, fn:function(){startLesson(0);}}],false);
    } else {
      spkEl.textContent="ミナモト仙人";
      typewrite("正解じゃ。第"+(idx+1)+"課「"+L.title+"」修了 ✓\n\n次へ進もう。");
      setChoices([{label:"→ 第"+(idx+2)+"課「"+LESSONS[idx+1].title+"」へ", fn:function(){startLesson(idx+1);}}],false);
    }
  } else {
    beep(220,.12); phase="why"; hideChoices();
    spkEl.textContent="ミナモト仙人";
    typewrite(L.why);
  }
}
document.getElementById("resetBtn").addEventListener("click",function(){
  save={done:LESSONS.map(function(){return false;}),cur:0}; persist(); renderProgress(); startLesson(0);
});

var listenPanel=document.getElementById("listenPanel"), listenList=document.getElementById("listenList");
var listenBuilt=false;
document.getElementById("listenBtn").addEventListener("click",function(){
  var open=listenPanel.classList.toggle("show");
  this.textContent= open?"🎧 聞くモード（閉じる）":"🎧 聞くモード（全レッスン文を並べる）";
  if(open&&!listenBuilt){
    listenBuilt=true;
    LESSONS.forEach(function(L,i){
      var d=document.createElement("div"); d.className="listen-item";
      var b=document.createElement("b"); b.textContent="第"+(i+1)+"課「"+L.title+"」";
      d.appendChild(b); d.appendChild(document.createTextNode("\n"+L.body+"\n（補足）"+L.supp));
      listenList.appendChild(d);
    });
  }
  if(!open) stopListen();
});
var listenState={playing:false, paused:false, i:0, uid:0};
var playBtn=document.getElementById("listenPlay"), statusEl=document.getElementById("listenStatus"), barEl=document.getElementById("listenBar");
var listenItems=[];
LESSONS.forEach(function(L){ listenItems.push("第"+(i0(L))+"課 "+L.title+"。"+L.body); });
function i0(L){ return LESSONS.indexOf(L)+1; }
function listenSpeak(){
  var st=listenState; if(st.i>=listenItems.length){ stopListen(); statusEl.textContent="再生が終わりました。"; return; }
  var myUid=++st.uid;
  statusEl.textContent="再生中 "+(st.i+1)+" / "+listenItems.length;
  barEl.style.width=Math.round(st.i/listenItems.length*100)+"%";
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(listenItems[st.i].replace(/\n+/g,"。"));
    u.lang="ja-JP"; u.rate=1.0;
    var vs=speechSynthesis.getVoices();
    for(var i=0;i<vs.length;i++){ if(vs[i].lang&&vs[i].lang.indexOf("ja")===0){u.voice=vs[i];break;} }
    u.onend=function(){ if(listenState.uid!==myUid) return; listenState.i++; if(listenState.playing) listenSpeak(); };
    speechSynthesis.speak(u);
  }catch(e){ statusEl.textContent="このブラウザでは音声再生が使えませんでした。"; }
}
function stopListen(){
  listenState.playing=false; listenState.paused=false; listenState.i=0; listenState.uid++;
  try{speechSynthesis.cancel();}catch(e){}
  playBtn.textContent="▶ ブラウザ音声で再生"; barEl.style.width="0%";
}
playBtn.addEventListener("click",function(){
  var st=listenState;
  if(st.playing){ /* pause: cancel current, resume replays item head */
    st.playing=false; st.paused=true; st.uid++;
    try{speechSynthesis.cancel();}catch(e){}
    playBtn.textContent="▶ 再開（この課の頭から）";
    statusEl.textContent="一時停止中 "+(st.i+1)+" / "+listenItems.length;
  } else {
    st.playing=true; st.paused=false; playBtn.textContent="⏸ 一時停止"; listenSpeak();
  }
});
document.getElementById("listenStop").addEventListener("click",function(){ stopListen(); statusEl.textContent="停止しました。"; });

      var t=document.createElement("div"); t.className="gt"; t.textContent="第"+(i+1)+"課 ― "+d.t;
      item.appendChild(t);
      var holder=document.createElement("div"); holder.innerHTML=d.svg; item.appendChild(holder);
      list.appendChild(item);
    });
  }
});

/* ============ 開始 ============ */
renderProgress();
startLesson(idx);
</script>
</body>
</html>
