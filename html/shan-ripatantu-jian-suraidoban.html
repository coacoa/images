<title>煽りパターン図鑑 スライド版</title>
<style>
  :root{
    --bg-top:#0d1018;
    --bg-bot:#171c28;
    --ink:#eef0f4;
    --sub:#b2bac8;
    --accent:#e8543c;
    --gold:#f0b23c;
    --line:#465064;
    --panel:rgba(10,12,18,.82);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans CJK JP","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
    background:linear-gradient(180deg,var(--bg-top),var(--bg-bot));
    color:var(--ink);
    overflow:hidden;
    -webkit-user-select:none;
    user-select:none;
  }
  /* 上部アクセントバー（進捗を兼ねる） */
  #topbar{
    position:fixed; top:0; left:0; height:8px; width:100%;
    background:rgba(255,255,255,.06); z-index:30;
  }
  #topfill{
    height:100%; width:0%;
    background:var(--accent);
    transition:width .35s ease;
  }
  #stage{
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    cursor:pointer;
  }
  #slide{
    flex:1 1 auto;
    display:flex; flex-direction:column; justify-content:center;
    padding:4vh 6.5vw 2vh;
    min-height:0;
  }
  .slide-inner{ animation:fadein .3s ease; }
  @keyframes fadein{ from{ opacity:0; } to{ opacity:1; } }
  @media (prefers-reduced-motion: reduce){
    .slide-inner{ animation:none; }
    #topfill{ transition:none; }
  }
  .label{
    color:var(--gold);
    font-weight:700;
    font-size:clamp(15px,2.1vw,28px);
    letter-spacing:.14em;
    margin:0 0 1.6vh;
  }
  .stitle{
    font-weight:700;
    font-size:clamp(30px,5.6vw,76px);
    line-height:1.25;
    margin:0;
    overflow-wrap:anywhere;
  }
  .is-title .stitle{ font-size:clamp(34px,6.2vw,92px); }
  .rule{
    width:170px; height:6px; background:var(--accent);
    margin:2.6vh 0 3.2vh;
  }
  .is-title .rule{ width:230px; }
  .subtitle-line{
    color:var(--sub);
    font-size:clamp(17px,2.5vw,34px);
    margin:0 0 3.4vh;
  }
  ul.bullets{
    list-style:none; margin:0; padding:0;
  }
  ul.bullets li{
    position:relative;
    font-size:clamp(16px,2.45vw,33px);
    line-height:1.5;
    padding-left:1.5em;
    margin:0 0 2.1vh;
    overflow-wrap:anywhere;
  }
  ul.bullets li::before{
    content:"";
    position:absolute; left:.1em; top:.52em;
    border-left:.5em solid var(--accent);
    border-top:.3em solid transparent;
    border-bottom:.3em solid transparent;
  }
  .is-title ul.bullets li::before{
    border-left:none; border-top:none; border-bottom:none;
    content:"・"; color:var(--ink);
    left:0; top:0;
  }
  .is-title ul.bullets li{ padding-left:1.2em; }
  /* 字幕バー（読み上げ文） */
  #caption{
    flex:0 0 auto;
    background:var(--panel);
    border-top:1px solid var(--line);
    padding:10px 6.5vw 12px;
    font-size:clamp(12px,1.45vw,19px);
    line-height:1.65;
    color:var(--sub);
    max-height:22vh;
    overflow:hidden;
  }
  #caption .cap-text{ color:#d6dbe4; }
  /* 操作バー */
  #controls{
    flex:0 0 auto;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:8px 12px calc(8px + env(safe-area-inset-bottom));
    background:rgba(8,10,15,.9);
    border-top:1px solid var(--line);
    cursor:default;
    transition:opacity .4s ease;
  }
  #controls button{
    min-height:40px; min-width:44px;
    padding:6px 14px;
    font:inherit; font-size:15px;
    color:var(--ink);
    background:#232a3a;
    border:1px solid var(--line);
    border-radius:8px;
    cursor:pointer;
  }
  #controls button:hover{ background:#2d3649; }
  #controls button:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  #controls button[aria-pressed="true"]{
    background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700;
  }
  #progress{
    font-size:15px; color:var(--sub);
    font-variant-numeric:tabular-nums;
    margin:0 4px;
    white-space:nowrap;
  }
  #controls .spacer{ flex:1 1 auto; }
  #statemsg{ font-size:13px; color:var(--gold); white-space:nowrap; }
  /* フルスクリーン時：操作バーはマウスを動かした時だけ出す（OBS録画用） */
  body.fs #controls{ opacity:0; pointer-events:none; }
  body.fs #controls.show{ opacity:1; pointer-events:auto; }
  body.fs #caption{ padding-bottom:14px; }
  @media (max-width:560px){
    #slide{ padding:3vh 5vw 1vh; }
    #caption{ padding-left:5vw; padding-right:5vw; }
    #controls button{ padding:6px 10px; font-size:14px; }
    #statemsg{ display:none; }
  }
</style>
</head>

var N = SLIDES.length;

var idx = 0;
var voiceOn = true;
var autoplay = false;
var speakToken = 0;
var fallbackTimer = null;
var hideTimer = null;

var slideEl = document.getElementById("slide");
var capText = document.getElementById("capText");
var progressEl = document.getElementById("progress");
var topfill = document.getElementById("topfill");
var btnPrev = document.getElementById("btnPrev");
var btnNext = document.getElementById("btnNext");
var btnVoice = document.getElementById("btnVoice");
var btnAuto = document.getElementById("btnAuto");
var btnFs = document.getElementById("btnFs");
var controlsEl = document.getElementById("controls");
var statemsg = document.getElementById("statemsg");

function render() {
  var s = SLIDES[idx];
  slideEl.innerHTML = "";
  var wrap = document.createElement("div");
  wrap.className = "slide-inner" + (idx === 0 ? " is-title" : "");
  var lab = document.createElement("p");
  lab.className = "label";
  lab.textContent = s.label;
  var ttl = document.createElement("h1");
  ttl.className = "stitle";
  ttl.textContent = s.title;
  var rule = document.createElement("div");
  rule.className = "rule";
  wrap.appendChild(lab);
  wrap.appendChild(ttl);
  wrap.appendChild(rule);
  if (s.sub) {
    var sub = document.createElement("p");
    sub.className = "subtitle-line";
    sub.textContent = s.sub;
    wrap.appendChild(sub);
  }
  var ul = document.createElement("ul");
  ul.className = "bullets";
  for (var i = 0; i < s.bullets.length; i++) {
    var li = document.createElement("li");
    li.textContent = s.bullets[i];
    ul.appendChild(li);
  }
  wrap.appendChild(ul);
  slideEl.appendChild(wrap);
  capText.textContent = s.narration;
  progressEl.textContent = (idx + 1) + " / " + N;
  topfill.style.width = ((idx + 1) / N * 100) + "%";
  document.title = s.title + " ― 煽りパターン図鑑 スライド版";
}

function clearFallback() {
  if (fallbackTimer !== null) { clearTimeout(fallbackTimer); fallbackTimer = null; }
}

function stopSpeak() {
  speakToken++;
  clearFallback();
  if ("speechSynthesis" in window) {
    try { speechSynthesis.cancel(); } catch (e) {}
  }
}

/* 読み上げ時間の推定（日本語 約6.3文字/秒 + 間） */
function estimateMs(text) {
  return Math.round(text.length * 160) + 1500;
}

function pickJaVoice() {
  if (!("speechSynthesis" in window)) return null;
  var vs = speechSynthesis.getVoices();
  for (var i = 0; i < vs.length; i++) {
    if (vs[i].lang && vs[i].lang.toLowerCase().indexOf("ja") === 0) return vs[i];
  }
  return null;
}
if ("speechSynthesis" in window && speechSynthesis.onvoiceschanged !== undefined) {
  speechSynthesis.onvoiceschanged = function () {};
}

function scheduleFallbackAdvance(token, ms) {
  clearFallback();
  fallbackTimer = setTimeout(function () {
    if (token === speakToken && autoplay) advance();
  }, ms);
}

function speakCurrent() {
  stopSpeak();
  var s = SLIDES[idx];
  if (!autoplay && !voiceOn) return;
  if (!voiceOn || !("speechSynthesis" in window)) {
    /* 音声が使えない／OFF のときは文字数推定で送る（自動再生のみ） */
    if (autoplay) scheduleFallbackAdvance(speakToken, estimateMs(s.narration));
    return;
  }
  var token = speakToken;
  var startedAt = Date.now();
  var done = false;
  var u = new SpeechSynthesisUtterance(s.narration);
  u.lang = "ja-JP";
  var v = pickJaVoice();
  if (v) u.voice = v;
  u.rate = 1.0;
  u.pitch = 1.0;
  function finish() {
    if (done || token !== speakToken) return;
    done = true;
    clearFallback();
    if (!autoplay) return;
    /* 無音のまま即終了した場合は推定時間まで待ってから送る */
    var elapsed = Date.now() - startedAt;
    var minWait = estimateMs(s.narration) * 0.6;
    if (elapsed < minWait) {
      scheduleFallbackAdvance(token, minWait - elapsed);
    } else {
      advance();
    }
  }
  u.onend = finish;
  u.onerror = function () {
    if (done || token !== speakToken) return;
    if (autoplay) {
      /* エラー時は推定時間で送る */
      done = true;
      scheduleFallbackAdvance(token, estimateMs(s.narration) * 0.7);
    }
  };
  try {
    speechSynthesis.speak(u);
  } catch (e) {
    if (autoplay) scheduleFallbackAdvance(token, estimateMs(s.narration));
    return;
  }
  if (autoplay) {
    /* onend が来ない環境への安全網（推定＋余裕） */
    scheduleFallbackAdvance(token, estimateMs(s.narration) + 6000);
    /* Chrome系で読み上げが止まる事象への定期 resume */
    var guard = setInterval(function () {
      if (done || token !== speakToken) { clearInterval(guard); return; }
      if (speechSynthesis.paused) { try { speechSynthesis.resume(); } catch (e) {} }
      if (!speechSynthesis.speaking && !speechSynthesis.pending) clearInterval(guard);
    }, 5000);
  }
}

function go(n) {
  idx = Math.max(0, Math.min(N - 1, n));
  render();
  speakCurrent();
}

function advance() {
  if (idx >= N - 1) {
    setAutoplay(false);
    statemsg.textContent = "最終スライドです";
    return;
  }
  go(idx + 1);
}

function setAutoplay(on) {
  autoplay = on;
  btnAuto.setAttribute("aria-pressed", on ? "true" : "false");
  btnAuto.textContent = on ? "⏸ 自動再生中" : "▶ 自動再生";
  statemsg.textContent = on ? "読み上げに連動して進みます" : "";
  if (on) {
    if (idx >= N - 1) idx = 0;
    render();
    speakCurrent();
  } else {
    stopSpeak();
  }
}

btnPrev.addEventListener("click", function (e) { e.stopPropagation(); go(idx - 1); });
btnNext.addEventListener("click", function (e) { e.stopPropagation(); go(idx + 1); });
btnVoice.addEventListener("click", function (e) {
  e.stopPropagation();
  voiceOn = !voiceOn;
  btnVoice.setAttribute("aria-pressed", voiceOn ? "true" : "false");
  btnVoice.textContent = voiceOn ? "読み上げ ON" : "読み上げ OFF";
  if (!voiceOn) {
    stopSpeak();
    if (autoplay) scheduleFallbackAdvance(speakToken, estimateMs(SLIDES[idx].narration));
  } else {
    speakCurrent();
  }
});
btnAuto.addEventListener("click", function (e) { e.stopPropagation(); setAutoplay(!autoplay); });
btnFs.addEventListener("click", function (e) {
  e.stopPropagation();
  if (document.fullscreenElement) {
    document.exitFullscreen();
  } else if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen();
  }
});

document.getElementById("stage").addEventListener("click", function (e) {
  if (e.target.closest("#controls")) return;
  go(idx + 1);
});

document.addEventListener("keydown", function (e) {
  var tag = (document.activeElement && document.activeElement.tagName) || "";
  if (e.key === " " && tag === "BUTTON") return; /* ボタン上のスペースはボタンの動作に任せる */
  if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
    e.preventDefault(); go(idx + 1);
  } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
    e.preventDefault(); go(idx - 1);
  } else if (e.key === "Home") {
    e.preventDefault(); go(0);
  } else if (e.key === "End") {
    e.preventDefault(); go(N - 1);
  }
});

/* フルスクリーン時、操作バーはしばらくで隠す */
function pokeControls() {
  if (!document.fullscreenElement) return;
  controlsEl.classList.add("show");
  if (hideTimer) clearTimeout(hideTimer);
  hideTimer = setTimeout(function () { controlsEl.classList.remove("show"); }, 2600);
}
document.addEventListener("fullscreenchange", function () {
  document.body.classList.toggle("fs", !!document.fullscreenElement);
  pokeControls();
});
document.addEventListener("mousemove", pokeControls);

render();
</script>
</body>
</html>
