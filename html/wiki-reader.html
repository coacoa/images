<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wikipedia 読み上げビューア</title>
<style>
  :root {
    --bg: #fdfdfb;
    --text: #1e1e1e;
    --muted: #6b6b6b;
    --accent: #2f5d50;
    --border: #ddd8ce;
    --panel: #f4f2ec;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.9;
  }
  header {
    padding: 20px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    margin: 0 0 12px 0;
    font-size: 1.3rem;
    letter-spacing: 0.02em;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .controls input[type="text"] {
    flex: 1 1 260px;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 1rem;
  }
  select, button {
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.95rem;
    background: #fff;
    cursor: pointer;
  }
  button.primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  button.primary:hover { opacity: 0.9; }
  .status {
    padding: 4px 24px;
    color: var(--muted);
    font-size: 0.9rem;
    min-height: 1.4em;
  }
  .display-controls {
    padding: 8px 24px;
    display: flex;
    gap: 10px;
    align-items: center;
    font-size: 0.85rem;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  .display-controls button {
    padding: 4px 10px;
    font-size: 0.85rem;
  }
  #searchResults {
    margin: 0 24px;
    padding: 0;
    list-style: none;
  }
  #searchResults li {
    border-bottom: 1px solid var(--border);
  }
  #searchResults button {
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    padding: 10px 4px;
    font-size: 0.95rem;
  }
  #searchResults button:hover { background: var(--panel); }

  /* ここから下が読み上げ対象の本文領域。
     Read Aloud等の拡張は可視テキストを上から順に読むため、
     余計な装飾要素を挟まず、見出し・段落のみのシンプルな構造にしています。 */
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 24px 80px 24px;
  }
  article h1 {
    font-size: 1.8rem;
    margin-bottom: 4px;
  }
  article .source-link {
    display: block;
    margin-bottom: 24px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  article .source-link a { color: var(--muted); }
  #content p {
    margin: 0 0 1.3em 0;
    font-size: var(--reading-size, 1.15rem);
  }
  #content h2 {
    margin-top: 1.8em;
    font-size: 1.3rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 4px;
  }
  #content section {
    margin-top: 2.4em;
    padding-top: 1.2em;
    border-top: 2px solid var(--border);
  }
  #content section:first-child {
    margin-top: 0;
    padding-top: 0;
    border-top: none;
  }
  #content h3 {
    margin-top: 1.5em;
    font-size: 1.1rem;
  }
  .empty-state {
    color: var(--muted);
    padding: 40px 24px;
    text-align: center;
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    padding: 20px;
  }
</style>
</head>
<body>

<header>
  <h1>Wikipedia 読み上げビューア</h1>
  <div class="controls">
    <select id="lang">
      <option value="ja" selected>日本語版</option>
      <option value="en">English</option>
    </select>
    <input type="text" id="query" placeholder="記事タイトルまたはキーワードを入力（例: 深層学習）">
    <button class="primary" id="fetchBtn">取得</button>
  </div>
  <label style="display:flex; align-items:center; gap:6px; margin-top:10px; font-size:0.9rem; color:var(--muted);">
    <input type="checkbox" id="combineMode">
    見つかった候補記事をすべて結合して長文モードで読み込む
  </label>
</header>

<div class="status" id="status"></div>

<div class="display-controls" id="displayControls" style="display:none;">
  文字サイズ:
  <button id="sizeDown">小</button>
  <button id="sizeUp">大</button>
  <span id="sizeLabel"></span>
  <span style="margin-left:12px; border-left:1px solid var(--border); padding-left:12px;">
    <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
      <input type="checkbox" id="skipShortLines">
      <input type="number" id="shortLineThreshold" min="1" step="1" value="40" style="width:56px; padding:2px 4px;">
      文字未満の改行区切り行を省略する
    </label>
  </span>
</div>

<div id="searchResultsHeader" style="display:none; padding: 0 24px 8px 24px;">
  <button id="combineAllBtn">候補をすべて結合して読み込む</button>
</div>
<ul id="searchResults"></ul>

<main id="main">
  <div class="empty-state">記事タイトルを入力して「取得」を押してください。<br>あいまいなキーワードの場合は候補一覧から選べます。</div>
</main>

<footer>本文はWikipedia (CC BY-SA) から取得しています。</footer>

<script>
const statusEl = document.getElementById('status');
const mainEl = document.getElementById('main');
const searchResultsEl = document.getElementById('searchResults');
const searchResultsHeaderEl = document.getElementById('searchResultsHeader');
const combineAllBtn = document.getElementById('combineAllBtn');
const combineModeCheckbox = document.getElementById('combineMode');
const displayControls = document.getElementById('displayControls');
const sizeLabel = document.getElementById('sizeLabel');
const skipShortLinesCheckbox = document.getElementById('skipShortLines');
const shortLineThresholdInput = document.getElementById('shortLineThreshold');

let lastResults = [];
let lastLang = 'ja';
let lastKeyword = '';

// 現在表示中のデータ（チェックボックス切り替え時に再取得せず再描画するために保持する）
let currentArticles = null;   // [{ title, extract, lang }]
let currentIsCombined = false;
let currentKeyword = '';

function getShortLineThreshold() {
  const v = parseInt(shortLineThresholdInput.value, 10);
  return (Number.isFinite(v) && v > 0) ? v : 40;
}

skipShortLinesCheckbox.checked = localStorage.getItem('skipShortLines') === '1';
shortLineThresholdInput.value = localStorage.getItem('shortLineThreshold') || '40';

skipShortLinesCheckbox.addEventListener('change', () => {
  localStorage.setItem('skipShortLines', skipShortLinesCheckbox.checked ? '1' : '0');
  if (currentArticles) renderCurrent();
});
shortLineThresholdInput.addEventListener('input', () => {
  localStorage.setItem('shortLineThreshold', String(getShortLineThreshold()));
  if (currentArticles && skipShortLinesCheckbox.checked) renderCurrent();
});

let readingSize = parseFloat(localStorage.getItem('readingSize') || '1.15');
applySize();

function applySize() {
  document.documentElement.style.setProperty('--reading-size', readingSize + 'rem');
  sizeLabel.textContent = readingSize.toFixed(2) + 'rem';
  localStorage.setItem('readingSize', readingSize);
}
document.getElementById('sizeUp').addEventListener('click', () => { readingSize = Math.min(2, readingSize + 0.1); applySize(); });
document.getElementById('sizeDown').addEventListener('click', () => { readingSize = Math.max(0.8, readingSize - 0.1); applySize(); });

function apiBase(lang) {
  return `https://${lang}.wikipedia.org/w/api.php`;
}

async function apiGet(lang, params) {
  const url = new URL(apiBase(lang));
  params.format = 'json';
  params.origin = '*';
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
  const res = await fetch(url.toString());
  if (!res.ok) throw new Error('ネットワークエラー: ' + res.status);
  return res.json();
}

function setStatus(msg) {
  statusEl.textContent = msg;
}

function showEmpty(msg) {
  mainEl.innerHTML = `<div class="empty-state">${msg}</div>`;
  displayControls.style.display = 'none';
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// 参考文献・関連項目・外部リンクなど、読み上げに不要な末尾セクションの見出し名
// （個別の単語をキリなく追加していくのではなく、これらの本当に定型的なものだけに限定。
//  翻訳一覧・漫画化・翻案などの「短文が並ぶだけのリスト」は下のSHORT_LINE_THRESHOLDによる
//  文字数ベースのフィルタ（短い断片行を省略するチェックボックス）側で処理する）
const BOILERPLATE_HEADINGS = [
  '脚注', '出典', '注釈', '注記', '参照', '参考文献', '関連項目', '外部リンク', 'ソース',
  'references', 'external links', 'see also', 'further reading', 'notes', 'citations', 'bibliography', 'sources'
];

function isBoilerplateHeading(text) {
  const t = text.trim().toLowerCase();
  return BOILERPLATE_HEADINGS.some(h => t === h.toLowerCase() || t.startsWith(h.toLowerCase()));
}

// 記事本文（プレーンテキスト）を見出し・段落のHTML断片に変換する補助関数。
// 参考文献・関連項目・外部リンク等の見出しに達したら打ち切る。
// skipShort が true の場合、threshold 文字未満の短い断片行（見出しは除く）を省略する。
function extractToHtml(extract, headingTag, skipShort, threshold) {
  const lines = extract.split('\n');
  let html = '';
  for (const line of lines) {
    if (!line.trim()) continue;
    const headingMatch = line.match(/^(={2,4})\s*(.+?)\s*\1$/);
    if (headingMatch) {
      if (isBoilerplateHeading(headingMatch[2])) break;
      html += `<${headingTag}>${escapeHtml(headingMatch[2])}</${headingTag}>`;
    } else {
      const text = line.trim();
      if (skipShort && text.length < threshold) continue;
      html += `<p>${escapeHtml(text)}</p>`;
    }
  }
  return html;
}

// 保持しているcurrentArticlesの内容から、現在のチェックボックス設定に基づいて再描画する
function renderCurrent() {
  const skipShort = skipShortLinesCheckbox.checked;
  const threshold = getShortLineThreshold();
  if (!currentIsCombined) {
    const a = currentArticles[0];
    const html = extractToHtml(a.extract, 'h2', skipShort, threshold);
    const pageUrl = `https://${a.lang}.wikipedia.org/wiki/${encodeURIComponent(a.title.replace(/ /g, '_'))}`;
    mainEl.innerHTML = `
      <article>
        <h1>${escapeHtml(a.title)}</h1>
        <span class="source-link">出典: <a href="${pageUrl}" target="_blank" rel="noopener">${pageUrl}</a></span>
        <div id="content">${html || '<p>本文を取得できませんでした。</p>'}</div>
      </article>
    `;
  } else {
    const combinedHtml = currentArticles.map(a => {
      const pageUrl = `https://${a.lang}.wikipedia.org/wiki/${encodeURIComponent(a.title.replace(/ /g, '_'))}`;
      return `
        <section>
          <h2>${escapeHtml(a.title)}</h2>
          <span class="source-link">出典: <a href="${pageUrl}" target="_blank" rel="noopener">${pageUrl}</a></span>
          ${extractToHtml(a.extract, 'h3', skipShort, threshold)}
        </section>
      `;
    }).join('');
    mainEl.innerHTML = `
      <article>
        <h1>結合ドキュメント: ${escapeHtml(currentKeyword)}</h1>
        <span class="source-link">${currentArticles.length}件の候補記事を結合して表示しています。</span>
        <div id="content">${combinedHtml || '<p>取得できる本文がありませんでした。</p>'}</div>
      </article>
    `;
  }
  displayControls.style.display = 'flex';
}

// 複数記事を1つの長文としてすべて結合し、記事ごとの見出し(h2)で区切って表示する
async function fetchAllAndCombine(results, lang, keyword) {
  searchResultsHeaderEl.style.display = 'none';
  searchResultsEl.innerHTML = '';
  const articles = [];
  for (let i = 0; i < results.length; i++) {
    const title = results[i].title;
    setStatus(`(${i + 1}/${results.length}) 「${title}」を取得中...`);
    try {
      const data = await apiGet(lang, {
        action: 'query',
        prop: 'extracts',
        explaintext: 1,
        redirects: 1,
        titles: title
      });
      const pages = data.query && data.query.pages;
      const page = pages ? Object.values(pages)[0] : null;
      if (!page || page.missing !== undefined) continue;
      articles.push({ title: page.title, extract: page.extract || '', lang });
    } catch (e) {
      continue;
    }
  }
  currentArticles = articles;
  currentIsCombined = true;
  currentKeyword = keyword;
  renderCurrent();
  setStatus(`結合完了（${articles.length}件）。読み上げ拡張機能から再生してください。`);
}

async function fetchArticle(title, lang) {
  setStatus(`「${title}」を取得中...`);
  try {
    const data = await apiGet(lang, {
      action: 'query',
      prop: 'extracts',
      explaintext: 1,
      redirects: 1,
      titles: title
    });
    const pages = data.query && data.query.pages;
    if (!pages) throw new Error('データ形式エラー');
    const page = Object.values(pages)[0];
    if (page.missing !== undefined) {
      showEmpty(`「${title}」という記事は見つかりませんでした。検索候補から選び直してください。`);
      setStatus('');
      return;
    }
    searchResultsEl.innerHTML = '';
    currentArticles = [{ title: page.title, extract: page.extract || '', lang }];
    currentIsCombined = false;
    currentKeyword = page.title;
    renderCurrent();
    setStatus('取得完了。ページ上部の再生ボタン等の読み上げ拡張機能から再生してください。');
  } catch (e) {
    setStatus('');
    showEmpty(`エラーが発生しました: ${e.message}<br>ブラウザのCORS制限の場合、このHTMLをローカルサーバー経由（例: <code>python3 -m http.server</code>）で開くと解決することがあります。`);
  }
}

async function search(keyword, lang) {
  setStatus(`「${keyword}」を検索中...`);
  searchResultsHeaderEl.style.display = 'none';
  try {
    const data = await apiGet(lang, {
      action: 'query',
      list: 'search',
      srsearch: keyword,
      srlimit: 8
    });
    const results = data.query && data.query.search;
    if (!results || results.length === 0) {
      showEmpty('該当する記事が見つかりませんでした。');
      setStatus('');
      return;
    }
    lastResults = results;
    lastLang = lang;
    lastKeyword = keyword;

    if (combineModeCheckbox.checked) {
      await fetchAllAndCombine(results, lang, keyword);
      return;
    }

    if (results.length === 1) {
      await fetchArticle(results[0].title, lang);
      return;
    }
    searchResultsEl.innerHTML = results.map(r =>
      `<li><button data-title="${escapeHtml(r.title)}">${escapeHtml(r.title)}</button></li>`
    ).join('');
    searchResultsHeaderEl.style.display = 'block';
    showEmpty('候補から記事を選ぶか、上の「すべて結合して読み込む」で長文モードにできます。');
    setStatus(`${results.length}件の候補が見つかりました。`);
    searchResultsEl.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => fetchArticle(btn.dataset.title, lang));
    });
  } catch (e) {
    setStatus('');
    showEmpty(`エラーが発生しました: ${e.message}`);
  }
}

document.getElementById('fetchBtn').addEventListener('click', () => {
  const q = document.getElementById('query').value.trim();
  const lang = document.getElementById('lang').value;
  if (!q) return;
  searchResultsEl.innerHTML = '';
  search(q, lang);
});

combineAllBtn.addEventListener('click', () => {
  if (lastResults.length > 0) {
    fetchAllAndCombine(lastResults, lastLang, lastKeyword);
  }
});

document.getElementById('query').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('fetchBtn').click();
});
</script>

</body>
</html>
