  var startedAt = Date.now();
  var done = false;
  var u = new SpeechSynthesisUtterance(s.narration);
  u.lang = "ja-JP";
  var v = pickJaVoice();
  if (v) u.voice = v;
  u.rate = 1.0;
  u.pitch = 1.0;
  function finish() {
    if (done || token !== speakToken) return;
    done = true;
    clearFallback();
    if (!autoplay) return;
    /* 無音のまま即終了した場合は推定時間まで待ってから送る */
    var elapsed = Date.now() - startedAt;
    var minWait = estimateMs(s.narration) * 0.6;
    if (elapsed < minWait) {
      scheduleFallbackAdvance(token, minWait - elapsed);
    } else {
      advance();
    }
  }
  u.onend = finish;
  u.onerror = function () {
    if (done || token !== speakToken) return;
    if (autoplay) {
      /* エラー時は推定時間で送る */
      done = true;
      scheduleFallbackAdvance(token, estimateMs(s.narration) * 0.7);
    }
  };
  try {
    speechSynthesis.speak(u);
  } catch (e) {
    if (autoplay) scheduleFallbackAdvance(token, estimateMs(s.narration));
    return;
  }
  if (autoplay) {
    /* onend が来ない環境への安全網（推定＋余裕） */
    scheduleFallbackAdvance(token, estimateMs(s.narration) + 6000);
    /* Chrome系で読み上げが止まる事象への定期 resume */
    var guard = setInterval(function () {
      if (done || token !== speakToken) { clearInterval(guard); return; }
      if (speechSynthesis.paused) { try { speechSynthesis.resume(); } catch (e) {} }
      if (!speechSynthesis.speaking && !speechSynthesis.pending) clearInterval(guard);
    }, 5000);
  }
}

function go(n) {
  idx = Math.max(0, Math.min(N - 1, n));
  render();
  speakCurrent();
}

function advance() {
  if (idx >= N - 1) {
    setAutoplay(false);
    statemsg.textContent = "最終スライドです";
    return;
  }
  go(idx + 1);
}

function setAutoplay(on) {
  autoplay = on;
  btnAuto.setAttribute("aria-pressed", on ? "true" : "false");
  btnAuto.textContent = on ? "⏸ 自動再生中" : "▶ 自動再生";
  statemsg.textContent = on ? "読み上げに連動して進みます" : "";
  if (on) {
    if (idx >= N - 1) idx = 0;
    render();
    speakCurrent();
  } else {
    stopSpeak();
  }
}

btnPrev.addEventListener("click", function (e) { e.stopPropagation(); go(idx - 1); });
btnNext.addEventListener("click", function (e) { e.stopPropagation(); go(idx + 1); });
btnVoice.addEventListener("click", function (e) {
  e.stopPropagation();
  voiceOn = !voiceOn;
  btnVoice.setAttribute("aria-pressed", voiceOn ? "true" : "false");
  btnVoice.textContent = voiceOn ? "読み上げ ON" : "読み上げ OFF";
  if (!voiceOn) {
    stopSpeak();
    if (autoplay) scheduleFallbackAdvance(speakToken, estimateMs(SLIDES[idx].narration));
  } else {
    speakCurrent();
  }
});
btnAuto.addEventListener("click", function (e) { e.stopPropagation(); setAutoplay(!autoplay); });
btnFs.addEventListener("click", function (e) {
  e.stopPropagation();
  if (document.fullscreenElement) {
    document.exitFullscreen();
  } else if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen();
  }
});

document.getElementById("stage").addEventListener("click", function (e) {
  if (e.target.closest("#controls")) return;
  go(idx + 1);
});

document.addEventListener("keydown", function (e) {
  var tag = (document.activeElement && document.activeElement.tagName) || "";
  if (e.key === " " && tag === "BUTTON") return; /* ボタン上のスペースはボタンの動作に任せる */
  if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
    e.preventDefault(); go(idx + 1);
  } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
    e.preventDefault(); go(idx - 1);
  } else if (e.key === "Home") {
    e.preventDefault(); go(0);
  } else if (e.key === "End") {
    e.preventDefault(); go(N - 1);
  }
});

/* フルスクリーン時、操作バーはしばらくで隠す */
function pokeControls() {
  if (!document.fullscreenElement) return;
  controlsEl.classList.add("show");
  if (hideTimer) clearTimeout(hideTimer);
  hideTimer = setTimeout(function () { controlsEl.classList.remove("show"); }, 2600);
}
document.addEventListener("fullscreenchange", function () {
  document.body.classList.toggle("fs", !!document.fullscreenElement);
  pokeControls();
});
document.addEventListener("mousemove", pokeControls);

render();
</script>
</body>
</html>
