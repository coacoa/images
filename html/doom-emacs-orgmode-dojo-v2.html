<script>
const SoundFX = (() => {
  let ctx = null;
  let enabled = true;

  function ensureCtx() {
    if (!ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) ctx = new AudioCtx();
    }
    if (ctx && ctx.state === 'suspended') ctx.resume();
  }

  function tone(freq, duration, type = 'square', gainVal = 0.06, delay = 0) {
    if (!enabled) return;
    ensureCtx();
    if (!ctx) return;
    const now = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    gain.gain.setValueAtTime(gainVal, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + duration);
  }

  return {
    isEnabled: () => enabled,
    toggle: () => { enabled = !enabled; return enabled; },
    blip: () => tone(520, 0.035, 'square', 0.03),
    click: () => tone(660, 0.06, 'square', 0.06),
    hint: () => {
      tone(330, 0.08, 'triangle', 0.08, 0);
      tone(294, 0.12, 'triangle', 0.08, 0.08);
    },
    correct: () => {
      tone(523.25, 0.09, 'square', 0.07, 0);
      tone(659.25, 0.09, 'square', 0.07, 0.09);
      tone(783.99, 0.09, 'square', 0.07, 0.18);
      tone(1046.50, 0.22, 'square', 0.08, 0.27);
    },
    wrong: () => {
      tone(220, 0.12, 'sawtooth', 0.07, 0);
      tone(175, 0.22, 'sawtooth', 0.07, 0.12);
    }
  };
})();

function drawMasterPixelArt(canvas, mood = 'normal') {
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, 16, 16);

  const P = {
    '.': null,
    'K': '#0d1117',
    'H': '#37946e',
    'L': '#6abe30',
    'G': '#f0c674',
    'S': '#f4cca1',
    'W': '#e6edf3',
    'E': '#1f2630',
    'R': '#ff7b72',
    'B': '#2b5c4f',
    '^': '#0d1117',
    '-': '#0d1117'
  };

  const sprite = [
    '......GG........',
    '.....GHHG.......',
    '....KHHHHK......',
    '...KHHHHHHK.....',
    '..KGGGGGGGGK....',
    '..KSSSSSSSSK....',
    '..KSESSSSESK....',
    '..KSSSSSSSSK....',
    '.KWWWWWWWWWWK...',
    '.KWWWWWWWWWWK...',
    '..KBBBBBBBBK....',
    '.KBBGGBBGGBBK...',
    '.KBBBBBBBBBBK...',
    '.KSSKBBBBKSSK...',
    '....KBBBBK......',
    '...KKK..KKK.....'
  ];

  if (mood === 'happy') {
    sprite[6] = '..KS^SSSS^SK....';
    sprite[7] = '..KSRSSSSRSK....';
  } else if (mood === 'think') {
    sprite[6] = '..KS-SSSS-SK....';
    sprite[2] = '....KHHHHK..G...';
  }

  for (let y = 0; y < 16; y++) {
    for (let x = 0; x < 16; x++) {
      const ch = sprite[y][x];
      if (P[ch]) {
        ctx.fillStyle = P[ch];
        ctx.fillRect(x, y, 1, 1);
      }
    }
  }
}

const STORAGE_KEY = 'doom_org_dojo_progress_v1';
let state = {
  screen: 'title',
  currentLessonId: 1,
  completed: [],
  ttsEnabled: false,
  typingDone: false
};

let typingTimer = null;

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed.completed)) {
        state.completed = parsed.completed;
      }
    }
  } catch (e) {}
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      completed: state.completed
    }));
    showToast('💾 保存しました');
  } catch (e) {}
  updateStatusBar();
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), 1400);
}

function formatText(raw) {
  return String(raw || '').replace(/\n/g, '<br>');
}

function stripHtml(html) {
  const tmp = document.createElement('div');
  tmp.innerHTML = formatText(html);
  return tmp.textContent || tmp.innerText || '';
}

function speakText(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'ja-JP';
  utter.rate = 1.08;
  window.speechSynthesis.speak(utter);
}

function stopSpeech() {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }
}

function updateStatusBar() {
  const count = state.completed.length;
  document.getElementById('done-count').textContent = count;
  document.getElementById('progress-fill').style.width = `${(count / LESSONS.length) * 100}%`;

  const locEl = document.getElementById('current-loc');
  if (state.screen === 'title') {
    locEl.textContent = '現在：タイトル';
  } else if (state.screen === 'select') {
    locEl.textContent = '現在：レベル選択';
  } else {
    const lesson = LESSONS.find(l => l.id === state.currentLessonId);
    locEl.textContent = `現在：第${lesson.id}課 / 全16課`;
  }
}

function stopTyping() {
  if (typingTimer) {
    clearInterval(typingTimer);
    typingTimer = null;
  }
}

function renderTitle() {
  stopTyping();
  state.screen = 'title';
  updateStatusBar();

  const main = document.getElementById('main-stage');
  main.innerHTML = `
    <div class="adv-stage">
      <div class="character-box">
        <canvas id="master-canvas" class="pixel-canvas" width="16" height="16"></canvas>
        <div class="char-name">Org仙人</div>
        <div class="char-mood">「階層と時間の理を説こう」</div>
      </div>
      <div class="diagram-box">
        <div class="diagram-title">📜 修行の全体マップ（全4章・16課）</div>
        <div class="diagram-content">
<pre>
  <span class="hl-gold">第1章：基礎と階層操作</span>   (1〜4課)  ── プレーンテキスト・TAB開閉・M-矢印
  <span class="hl-green">第2章：タスク管理と状態</span> (5〜8課)  ── TODO/DONE・優先度・タグ・ドロワー
  <span class="hl-blue">第3章：時間管理とAgenda</span> (9〜12課) ── SCHEDULED/DEADLINE・Agenda・Capture
  <span class="hl-purple">第4章：文書作成と知識</span>   (13〜16課)── 表計算・Babelコード実行・Export・Roam
</pre>
        </div>
      </div>
    </div>

    <div class="dialogue-window" style="cursor: default;">
      <h2># Doom Emacs Org-mode 修行道場</h2>
      <div class="dialogue-text">Org仙人のもとで、アウトライン作成・タスク管理・スケジュール統合・文書生成を Doom Emacs の Org-mode で1から身につける実践道場じゃ。<br>基礎と階層操作・タスク管理・時間管理とAgenda・文書作成と知識整理、各4課ずつ全16課。<br>主役はプレーンテキストの <code>.org</code> ファイル。「分かった！」で次へ、「分からない」で何度でもやり直しじゃ。<br><br><strong>遊び方：</strong><br>説明を読んだら「これは分かった！」か「分からない」を選ぶだけ。分かったら確認問題が1問出て、正解でその課は理解済み ✔ になる。<br>間違えてもペナルティなし、補足説明を読んで何度でも挑めるぞ。本文クリックで文字送りスキップ、長い文は自動スクロール＋手動スクロール可じゃ。<br>キーはすべて Doom Emacs の既定（<code>evil-mode</code>、<code>:lang org</code> 前提）。実際に Doom を開いて <code>~/org/test.org</code> を作り、読みながら指を動かすと一番効くぞ！</div>
    </div>

    <div class="action-area">
      <div class="action-group">
        <button id="btn-enter-dojo" class="btn-8bit btn-primary">▶ 道場に入る</button>
        <button id="btn-continue-dojo" class="btn-8bit">📖 続きから学ぶ</button>
      </div>
      <div style="font-size: 0.82rem; color: var(--muted);">進捗（理解済み ✔）はブラウザに自動保存されます</div>
    </div>
  `;

  drawMasterPixelArt(document.getElementById('master-canvas'), 'normal');

  document.getElementById('btn-enter-dojo').onclick = () => {
    SoundFX.click();
    renderSelect();
  };

  document.getElementById('btn-continue-dojo').onclick = () => {
    SoundFX.click();
    const nextUnfinished = LESSONS.find(l => !state.completed.includes(l.id)) || LESSONS[0];
    renderLesson(nextUnfinished.id);
  };
}

function renderSelect() {
  stopTyping();
  state.screen = 'select';
  updateStatusBar();

  const main = document.getElementById('main-stage');
  let stagesHtml = '<div class="level-grid">';

  for (const st of STAGES) {
    stagesHtml += `<div class="stage-card"><h3>${st.title}</h3><div class="lesson-list">`;
    for (const lid of st.lessons) {
      const lesson = LESSONS.find(l => l.id === lid);
      const isDone = state.completed.includes(lid);
      stagesHtml += `
        <button class="lesson-btn ${isDone ? 'done' : ''}" data-lid="${lid}">
          <span>${lesson.title.replace(/^第\d+課：/, `第${lid}課 `)}</span>
          <span class="badge-done">${isDone ? '✔' : '▶'}</span>
        </button>
      `;
    }
    stagesHtml += '</div></div>';
  }
  stagesHtml += '</div>';

  main.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
      <h2 style="color:var(--gold); font-size:1.05rem;">🏯 修行コース選択（全16課）</h2>
      <button id="btn-back-title" class="btn-8bit">◀ タイトルへ戻る</button>
    </div>
    ${stagesHtml}
  `;

  document.getElementById('btn-back-title').onclick = () => {
    SoundFX.click();
    renderTitle();
  };

  main.querySelectorAll('.lesson-btn').forEach(btn => {
    btn.onclick = () => {
      SoundFX.click();
      const lid = Number(btn.getAttribute('data-lid'));
      renderLesson(lid);
    };
  });
}

function renderLesson(lessonId) {
  stopTyping();
  stopSpeech();

  state.screen = 'lesson';
  state.currentLessonId = lessonId;
  state.typingDone = false;
  updateStatusBar();

  const lesson = LESSONS.find(l => l.id === lessonId);
  const isDone = state.completed.includes(lessonId);

  const main = document.getElementById('main-stage');
  main.innerHTML = `
    <div class="adv-stage">
      <div class="character-box">
        <canvas id="master-canvas" class="pixel-canvas" width="16" height="16"></canvas>
        <div class="char-name">Org仙人</div>
        <div id="char-mood" class="char-mood">${isDone ? '「免許皆伝済みじゃ！」' : '「よく聞くのじゃ」'}</div>
      </div>
      <div class="diagram-box">
        <div class="diagram-title">${lesson.diagramTitle}</div>
        <div class="diagram-content">${lesson.diagram}</div>
      </div>
    </div>

    <div id="dialogue-win" class="dialogue-window" title="クリックで全文を即表示">
      <h2>${lesson.title} ${isDone ? '<span style="color:var(--accent); font-size:0.85rem;">[理解済み ✔]</span>' : ''}</h2>
      <div id="dialogue-body" class="dialogue-text"></div>
    </div>

    <div class="action-area">
      <div class="action-group">
        <button id="btn-understood" class="btn-8bit btn-primary">✔ これは分かった！</button>
        <button id="btn-not-understood" class="btn-8bit btn-warn">❓ 分からない（補足を見る）</button>
      </div>
      <div class="action-group">
        <button id="btn-prev" class="btn-8bit" ${lessonId <= 1 ? 'disabled style="opacity:0.4;cursor:not-allowed;"' : ''}>◀ 前の課</button>
        <button id="btn-next" class="btn-8bit" ${lessonId >= LESSONS.length ? 'disabled style="opacity:0.4;cursor:not-allowed;"' : ''}>次の課 ▶</button>
      </div>
    </div>

    <div id="supp-box" class="supp-box">
      <div class="supp-title">💡 Org仙人の補足解説</div>
      <div>${formatText(lesson.supplement)}</div>
    </div>

    <div id="quiz-box" class="quiz-box">
      <div class="quiz-title">⚔ 確認問題（正解で第${lesson.id}課クリア！）</div>
      <div class="quiz-q">${lesson.quiz.question}</div>
      <div id="quiz-options" class="quiz-options"></div>
      <div id="quiz-feedback" class="quiz-feedback"></div>
    </div>
  `;

  const canvas = document.getElementById('master-canvas');
  drawMasterPixelArt(canvas, isDone ? 'happy' : 'normal');

  const dialogueWin = document.getElementById('dialogue-win');
  const bodyEl = document.getElementById('dialogue-body');
  const fullHtml = formatText(lesson.body);

  const tokens = fullHtml.match(/(<[^>]+>|[^<])/g) || [];
  let idx = 0;
  let rendered = '';

  function finishTyping() {
    stopTyping();
    state.typingDone = true;
    bodyEl.innerHTML = fullHtml + '<span class="cursor-blink">▼</span>';
  }

  typingTimer = setInterval(() => {
    if (idx >= tokens.length) {
      finishTyping();
      return;
    }
    const tok = tokens[idx++];
    rendered += tok;
    if (!tok.startsWith('<') && idx % 3 === 0) {
      SoundFX.blip();
    }
    bodyEl.innerHTML = rendered + '<span class="cursor-blink">▼</span>';
    dialogueWin.scrollTop = dialogueWin.scrollHeight;
  }, 16);

  dialogueWin.onclick = () => {
    if (!state.typingDone) {
      finishTyping();
    }
  };

  if (state.ttsEnabled) {
    speakText(lesson.title + '。' + stripHtml(lesson.body));
  }

  document.getElementById('btn-understood').onclick = () => {
    if (!state.typingDone) finishTyping();
    SoundFX.click();
    showQuiz(lesson);
  };

  document.getElementById('btn-not-understood').onclick = () => {
    if (!state.typingDone) finishTyping();
    SoundFX.hint();
    drawMasterPixelArt(canvas, 'think');
    document.getElementById('char-mood').textContent = '「噛み砕いて説明しよう」';
    const suppBox = document.getElementById('supp-box');
    suppBox.classList.add('visible');
    suppBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  };

  if (lessonId > 1) {
    document.getElementById('btn-prev').onclick = () => {
      SoundFX.click();
      renderLesson(lessonId - 1);
    };
  }

  if (lessonId < LESSONS.length) {
    document.getElementById('btn-next').onclick = () => {
      SoundFX.click();
      renderLesson(lessonId + 1);
    };
  }
}

function showQuiz(lesson) {
  const quizBox = document.getElementById('quiz-box');
  const optsEl = document.getElementById('quiz-options');
  const fbEl = document.getElementById('quiz-feedback');
  const canvas = document.getElementById('master-canvas');

  quizBox.classList.add('visible');
  fbEl.className = 'quiz-feedback';
  fbEl.innerHTML = '';
  optsEl.innerHTML = '';

  lesson.quiz.options.forEach((optText, idx) => {
    const btn = document.createElement('button');
    btn.className = 'quiz-opt';
    btn.textContent = `${idx + 1}. ${optText}`;
    btn.onclick = () => {
      if (idx === lesson.quiz.answer) {
        SoundFX.correct();
        drawMasterPixelArt(canvas, 'happy');
        document.getElementById('char-mood').textContent = '「見事じゃ！合格！」';

        if (!state.completed.includes(lesson.id)) {
          state.completed.push(lesson.id);
          saveState();
        }

        const nextBtnHtml = lesson.id < LESSONS.length
          ? `<div style="margin-top:10px;"><button id="btn-quiz-next" class="btn-8bit btn-primary">次の第${lesson.id + 1}課へ進む ▶</button></div>`
          : `<div style="margin-top:10px;"><button id="btn-quiz-finish" class="btn-8bit btn-primary">🎉 全16課制覇！レベル選択へ</button></div>`;

        fbEl.className = 'quiz-feedback ok';
        fbEl.innerHTML = `✔ ${lesson.quiz.explanation}${nextBtnHtml}`;

        const qNext = document.getElementById('btn-quiz-next');
        if (qNext) {
          qNext.onclick = () => {
            SoundFX.click();
            renderLesson(lesson.id + 1);
          };
        }
        const qFin = document.getElementById('btn-quiz-finish');
        if (qFin) {
          qFin.onclick = () => {
            SoundFX.click();
            renderSelect();
          };
        }
      } else {
        SoundFX.wrong();
        drawMasterPixelArt(canvas, 'think');
        document.getElementById('char-mood').textContent = '「むむ、もう一息じゃ！」';
        fbEl.className = 'quiz-feedback ng';
        fbEl.innerHTML = '✖ 惜しい！もう一度上の説明や「分からない（補足を見る）」を確認して再挑戦じゃ！';
        document.getElementById('supp-box').classList.add('visible');
      }
    };
    optsEl.appendChild(btn);
  });

  quizBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function buildExtraPanels() {
  const transcriptPanel = document.getElementById('transcript-panel');
  const reviewPanel = document.getElementById('review-panel');

  transcriptPanel.innerHTML = LESSONS.map(l => `
    <div class="transcript-item">
      <h4>${l.title}</h4>
      <p>${stripHtml(l.body)}</p>
      <p style="color:var(--warn); margin-top:4px;">${stripHtml(l.supplement)}</p>
    </div>
  `).join('');

  reviewPanel.innerHTML = LESSONS.map(l => `
    <div class="review-card">
      <h4>第${l.id}課：${l.diagramTitle}</h4>
      ${l.diagram}
    </div>
  `).join('');
}

document.getElementById('btn-sound').onclick = function () {
  const on = SoundFX.toggle();
  this.textContent = on ? '🔊 音ON' : '🔇 音OFF';
  this.classList.toggle('active', on);
  if (on) SoundFX.click();
};

document.getElementById('btn-tts').onclick = function () {
  state.ttsEnabled = !state.ttsEnabled;
  this.textContent = state.ttsEnabled ? '🗣 読上ON' : '🗣 読上OFF';
  this.classList.toggle('active', state.ttsEnabled);
  if (!state.ttsEnabled) stopSpeech();
  SoundFX.click();
};

document.getElementById('btn-home').onclick = () => {
  SoundFX.click();
  stopSpeech();
  renderSelect();
};

document.getElementById('btn-reset').onclick = () => {
  if (confirm('学習の進捗（理解済み ✔）をすべてリセットしますか？')) {
    state.completed = [];
    saveState();
    SoundFX.wrong();
    if (state.screen === 'select') renderSelect();
    else if (state.screen === 'lesson') renderLesson(state.currentLessonId);
    else renderTitle();
  }
};

document.getElementById('btn-play-all').onclick = () => {
  SoundFX.click();
  const fullScript = LESSONS.map(l => `${l.title}。${stripHtml(l.body)}`).join('\n');
  speakText(fullScript);
  showToast('🎧 全レッスン読み上げを開始しました');
};

document.getElementById('btn-stop-all').onclick = () => {
  SoundFX.click();
  stopSpeech();
};

document.getElementById('btn-toggle-transcript').onclick = () => {
  SoundFX.click();
  document.getElementById('transcript-panel').classList.toggle('visible');
};

document.getElementById('btn-toggle-diagrams').onclick = function () {
  SoundFX.click();
  const panel = document.getElementById('review-panel');
  const visible = panel.classList.toggle('visible');
  this.textContent = visible ? '🖼 図解一覧（復習用）を隠す' : '🖼 図解一覧（復習用）を表示';
};

loadState();
buildExtraPanels();
renderTitle();
</script>
</body>
</html>
