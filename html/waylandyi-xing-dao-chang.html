/* ================= 図解ヘルパ ================= */
function svgWrap(body){
  return '<svg viewBox="0 0 300 124" xmlns="http://www.w3.org/2000/svg">'
    + '<defs><marker id="arw" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#39d0c4"/></marker></defs>'

}
function bx(x,y,w,h,fill,stroke){ return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="4" fill="'+(fill||'#14202e')+'" stroke="'+(stroke||'#39d0c4')+'" stroke-width="1.6"/>'; }
function tx(x,y,s,size,fill,anchor){ return '<text x="'+x+'" y="'+y+'" font-size="'+(size||11)+'" fill="'+(fill||'#ffffff')+'" text-anchor="'+(anchor||'middle')+'" font-family="monospace">'+s+'</text>'; }
function ar(x1,y1,x2,y2){ return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="#39d0c4" stroke-width="1.8" marker-end="url(#arw)"/>'; }
function ln(x1,y1,x2,y2,c){ return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||'#ff6b6b')+'" stroke-width="1.8"/>'; }
function cross(x,y){ return ln(x-7,y-7,x+7,y+7)+ln(x-7,y+7,x+7,y-7); }

/* ================= シナリオデータ ================= */
var CHAPTERS = [
  { title:"第1章　なぜ xinput が効かないのか", lessons:[
  {
    id:"l01", title:"X11とWaylandは「話し相手」が違う",
    lines:[
      ["仙人","よく来た。お主の悩みは分かっておる。LXQt＋i3 では <code>xinput list</code> でタッチパッドを見つけ、<code>xinput disable</code> で手軽にON/OFFできた。じゃが Wayland ではそれができない、とな。"],
      ["あおい","そうなんです。Hyprland に移ったら、タッチパッドを止めるいつもの手が全部効かなくて……。"],

    ],
    extra:[

    diagram: svgWrap(

  {
    id:"l02", title:"xinput が届かない理由",
    lines:[
      ["あおい","じゃあ <code>xinput disable</code> が効かないのはなぜですか？ コマンド自体は存在するのに。"],
      ["仙人","<code>xinput</code> は「Xサーバーへの命令書」じゃ。Wayland セッションでは Xサーバー本人がおらん。おるのは互換用の <b>XWayland</b>（Xアプリを動かすための小さな Xサーバー）だけじゃ。"],
      ["仙人","そのため <code>xinput list</code> で見えるのは、XWayland が見せている<b>仮想的なデバイス一覧</b>にすぎん。そこで disable しても、届くのは XWayland の中だけ。Wayland ネイティブなアプリやコンポジタ本体の入力処理には一切届かんのじゃ。"],
      ["仙人","比喩で言えば、引っ越した先の住所に前の家の管理人宛ての手紙を出しておるようなものじゃ。コマンドがエラーにならなくても、相手が違う。"],

<script>
"use strict";
/* ================= エンジン ================= */
var SAVE_KEY = "waylandDojoSaveV1";
var TTS_KEY = "advTtsV1";
var $ = function(id){ return document.getElementById(id);};
var msgBox = $("msgBox"), choicesBox = $("choices"), nextMark = $("nextMark");
var diagPanel = $("diagPanel"), diagTitle = $("diagTitle"), diagBody = $("diagBody");

var save = { done:{}, sound:true};
try{ var raw = localStorage.getItem(SAVE_KEY); if(raw){ var p = JSON.parse(raw); if(p && p.done) save = p;}}catch(e){}
function persist(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save));}catch(e){}}

var ttsOn = false;
try{ ttsOn = localStorage.getItem(TTS_KEY) === "1";}catch(e){}
var jpVoice = null;
function pickVoice(){
if(!("speechSynthesis" in window)) return;
var vs = speechSynthesis.getVoices();
jpVoice = null;
for(var i=0;i<vs.length;i++){ if(vs[i].lang && vs[i].lang.indexOf("ja") === 0){ jpVoice = vs[i]; break;}}
updateTtsBtn();
}
function updateTtsBtn(){
var b = $("ttsBtn");
var has = ("speechSynthesis" in window) && jpVoice;
b.textContent = ttsOn? "🗣 読上ON": (has || ("speechSynthesis" in window)? "🗣 読上OFF": "🗣 読上（音声なし）");
b.classList.toggle("on", ttsOn);
}
function speak(text){
if(!ttsOn ||!("speechSynthesis" in window)) return;
var plain = text.replace(/<[^>]+>/g, "");
if(!plain.trim()) return;
speechSynthesis.cancel();
var u = new SpeechSynthesisUtterance(plain);
u.lang = "ja-JP"; u.rate = 1.0;
if(jpVoice) u.voice = jpVoice;
speechSynthesis.speak(u);
}
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice;}
$("ttsBtn").addEventListener("click", function(){
ttsOn =!ttsOn;
try{ localStorage.setItem(TTS_KEY, ttsOn? "1": "0");}catch(e){}
if(!ttsOn && "speechSynthesis" in window) speechSynthesis.cancel();
updateTtsBtn();
});
updateTtsBtn();

/* ---- 効果音 ---- */
var actx = null;
function beep(freq, dur, type, vol){
if(save.sound === false) return;
try{
if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
if(actx.state === "suspended") actx.resume();
var o = actx.createOscillator(), g = actx.createGain();
o.type = type || "square"; o.frequency.value = freq;
g.gain.value = vol || 0.03;
o.connect(g); g.connect(actx.destination);
var t = actx.currentTime;
o.start(t); g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.06));
o.stop(t + (dur || 0.06));
}catch(e){}
}
function jingle(ok){
if(ok){ beep(660,0.09); setTimeout(function(){ beep(880,0.12);}, 95);}
else { beep(196,0.16,"sawtooth",0.035);}
}
$("soundBtn").textContent = (save.sound === false)? "🔇 音OFF": "🔊 音ON";
$("soundBtn").classList.toggle("on", save.sound!== false);
$("soundBtn").addEventListener("click", function(){
save.sound = (save.sound === false)? true: false;
persist();
this.textContent = save.sound? "🔊 音ON": "🔇 音OFF";
this.classList.toggle("on", save.sound);
if(save.sound) beep(880, 0.08);
});

/* ---- 表示 ---- */
var typing = null;
function setCharaDim(who){
$("charaL").classList.toggle("dim", who === "あおい");
$("charaR").classList.toggle("dim", who === "仙人");
}
function showDiagram(lesson){
if(lesson && lesson.diagram){
diagTitle.textContent = "第" + lesson.no + "課 " + lesson.title;
diagBody.innerHTML = lesson.diagram;
diagPanel.classList.add("show");
} else {
diagPanel.classList.remove("show");
document.body.classList.remove("diagmenu");
}
}
function nearBottom(){
return (msgBox.scrollHeight - msgBox.scrollTop - msgBox.clientHeight) < 90;
}
function renderLines(lines, done){
clearInterval(typing);
msgBox.innerHTML = "";
nextMark.textContent = "";
var li = 0;
function nextLine(){
if(li >= lines.length){ typing = null; nextMark.textContent = ""; if(done) done(); return;}
var who = lines[li][0], html = lines[li][1];
setCharaDim(who);
var p = document.createElement("p");
var nameSpan = document.createElement("span");
nameSpan.className = "who" + (who === "あおい"? " me": "");
nameSpan.textContent = who + "：";
p.appendChild(nameSpan);
var body = document.createElement("span");
p.appendChild(body);
msgBox.appendChild(p);
speak(who + "。" + html);
var plain = html.replace(/<pre>[\s\S]*?<\/pre>/g, function(m){ return m;});
var tokens = html.split(/(<[^>]+>)/g);
var ti = 0, ci = 0, cur = "";
var stick = true;
typing = setInterval(function(){
if(ti >= tokens.length){
clearInterval(typing); typing = null;
li++; setTimeout(nextLine, 260); return;
}
var tok = tokens[ti];
if(tok.charAt(0) === "<"){ cur += tok; ti++; body.innerHTML = cur; return;}
if(ci < tok.length){
cur += tok.charAt(ci); ci++;
body.innerHTML = cur;
if(ci % 3 === 0) beep(1200, 0.015, "square", 0.006);
if(stick && nearBottom()) msgBox.scrollTop = msgBox.scrollHeight;
} else { ti++; ci = 0;}
}, 14);
msgBox.scrollTop = msgBox.scrollHeight;
}
nextLine();
}
function setChoices(items){
choicesBox.innerHTML = "";
document.body.classList.toggle("diagmenu", diagPanel.classList.contains("show") && items.length > 0);
items.forEach(function(it){
var b = document.createElement("button");
b.type = "button"; b.textContent = it.label;
b.addEventListener("click", function(){ beep(740, 0.05); it.onPick(b);});
choicesBox.appendChild(b);
});
}
function updateProgress(){
var n = ALL_LESSONS.filter(function(l){ return save.done[l.id];}).length;
$("progressLine").textContent = "進捗：" + n + " / " + ALL_LESSONS.length + " 課 習得" + (n === ALL_LESSONS.length? " ― 全課修了！🎉": "");
}

/* ---- 課の進行 ---- */
var current = null;
function startLesson(idx){
current = ALL_LESSONS[idx];
$("menu").classList.remove("show");
showDiagram(current);
renderLines(current.lines, function(){ askUnderstood(idx, false);});
setChoices([]);
}
function askUnderstood(idx, again){
var L = ALL_LESSONS[idx];
setChoices([
{ label:"✅ わかった（確認問題へ）", onPick:function(){ askCheck(idx);}},
{ label:"❓ わからない（補足を聞く）", onPick:function(){
showDiagram(L);
renderLines(L.extra, function(){ askUnderstood(idx, true);});
setChoices([]);
}}
]);
}
function askCheck(idx){
var L = ALL_LESSONS[idx], c = L.check;
showDiagram(L);
renderLines([["仙人", "確認じゃ。" + c.q]], function(){
var items = c.choices.map(function(text, ci){
return { label: (ci+1) + ". " + text, onPick: function(btn){
if(ci === c.answer){
btn.classList.add("good"); jingle(true);
save.done[L.id] = true; persist(); updateProgress();
renderLines([["仙人", c.why], ["仙人", "第" + L.no + "課、習得じゃ！"]], function(){
var items2 = [];
if(idx + 1 < ALL_LESSONS.length){
items2.push({ label:"▶ 次の課へ（第" + (idx+2) + "課）", onPick:function(){ startLesson(idx+1);}});
} else {
items2.push({ label:"🏆 修了の言葉を聞く", onPick:function(){ ending();}});
}
items2.push({ label:"📜 課一覧に戻る", onPick:function(){ showMenu();}});
setChoices(items2);
});
setChoices([]);
} else {
btn.classList.add("wrong"); jingle(false);
renderLines([["仙人", "惜しい。解説するぞ。"], ["仙人", c.why]], function(){ askCheck(idx);});
setChoices([]);
}
}};
});
setChoices(items);
});
setChoices([]);
}
function ending(){
showDiagram(null);
renderLines([
["仙人","全16課、修了じゃ。お主の当初の悩み――「LXQt＋i3 では xinput で手軽にできたのに、Wayland ではできない」――その正体は『命令の宛先が Xサーバーからコンポジタへ移った』ことじゃった。"],
["仙人","タッチパッド攻略の全図をもう一度。<code>hyprctl devices</code> で名前を知る → device ブロックで <code>enabled = false</code> → トグルは <code>hyprctl keyword</code> とスクリプト → 保険に i3 セッションを残す。"],
["あおい","『できない』じゃなくて『宛先が変わった』。この見方があれば、他の「できない」も自分で攻略できます。"],
["仙人","うむ。それが Wayland 移行の一番の収穫じゃ。実機で手を動かし、詰まったら第16課の切り分けに戻るがよい。道場はいつでも開いておるぞ。"]
], function(){
setChoices([{ label:"📜 課一覧に戻る", onPick:function(){ showMenu();}}]);
});
setChoices([]);
}
function showMenu(){
clearInterval(typing); typing = null;
showDiagram(null);
setChoices([]);
var menu = $("menu");
menu.innerHTML = "";
CHAPTERS.forEach(function(ch){
var h = document.createElement("h2"); h.textContent = ch.title; menu.appendChild(h);
ch.lessons.forEach(function(L){
var idx = ALL_LESSONS.indexOf(L);
var b = document.createElement("button");
b.type = "button"; b.className = "lessonBtn";
b.innerHTML = '<span class="no">第' + L.no + '課</span><span>' + L.title + '</span>' + (save.done[L.id]? '<span class="done">✔ 習得</span>': '');
b.addEventListener("click", function(){ startLesson(idx);});
menu.appendChild(b);
});
});
menu.classList.add("show");
msgBox.innerHTML = "<p><span class='who'>仙人：</span>課を選ぶのじゃ。✔ は習得済み。どこから始めてもよいが、初めてなら第1課から順にどうぞ。</p>";
speak("課を選ぶのじゃ。");
updateProgress();
}
$("menuBtn").addEventListener("click", showMenu);

renderLines([

["仙人","進め方は各課共通じゃ。説明 →「わかった／わからない」→ 確認問題が1問。正解で次の課へ進める。分からなければ補足を聞いてから同じ問題に戻るだけ、ペナルティはない。"]

<script>
"use strict";
/* ================= 聞くモード ================= */
(function(){
  var btn = document.getElementById("listenBtn");
  var panel = document.getElementById("listenPanel");
  var body = document.getElementById("listenBody");
  var playBtn = document.getElementById("listenPlay");
  var stopBtn = document.getElementById("listenStop");
  var bar = document.getElementById("listenBar");
  var status = document.getElementById("listenStatus");
  var built = false, items = [], idx = 0, playing = false, paused = false, uid = 0, tickTimer = null;

  function collect(){
    items = [];
    if(typeof CHAPTERS === "undefined") return;
    CHAPTERS.forEach(function(ch){
      items.push({ head: ch.title });
      ch.lessons.forEach(function(L){
        L.lines.forEach(function(ln){ items.push({ who: ln[0], text: ln[1] }); });
        L.extra.forEach(function(ln){ items.push({ who: ln[0], text: "（補足）" + ln[1] }); });
        items.push({ who: "仙人", text: "確認問題。" + L.check.q + " 答えは「" + L.check.choices[L.check.answer] + "」。" + L.check.why });
      });
    });
  }
  function build(){
    if(built) return; built = true;
    collect();
    var html = "";
    items.forEach(function(it){
      if(it.head){ html += "<h3>" + it.head + "</h3>"; }
      else {
        var plain = it.text.replace(/<pre>([\s\S]*?)<\/pre>/g, "$1").replace(/<[^>]+>/g, "");
        html += "<p><span class='who'>" + it.who + "：</span>" + plain.replace(/\n/g, "<br>") + "</p>";
      }
    });
    body.innerHTML = html;
  }
  function stopTimers(){ if(tickTimer){ clearInterval(tickTimer); tickTimer = null; } }
  function reset(){
    uid++; playing = false; paused = false; idx = 0;
    if("speechSynthesis" in window) speechSynthesis.cancel();
    stopTimers();
    bar.style.width = "0%"; status.textContent = "未再生";
    playBtn.textContent = "▶ ブラウザ音声で再生";
  }
  function speakNext(){
    if(!playing) return;
    var speechItems = items.filter(function(it){ return !it.head; });
    if(idx >= speechItems.length){ reset(); status.textContent = "再生終了"; return; }
    var it = speechItems[idx];
    var plain = it.text.replace(/<pre>([\s\S]*?)<\/pre>/g, "$1").replace(/<[^>]+>/g, "");
    var myUid = ++uid;
    var u = new SpeechSynthesisUtterance(it.who + "。" + plain);
    u.lang = "ja-JP"; u.rate = 1.0;
    var vs = ("speechSynthesis" in window) ? speechSynthesis.getVoices() : [];
    for(var i=0;i<vs.length;i++){ if(vs[i].lang && vs[i].lang.indexOf("ja") === 0){ u.voice = vs[i]; break; } }
    u.onend = function(){ if(myUid === uid && playing && !paused){ idx++; speakNext(); } };
    u.onerror = function(){ if(myUid === uid && playing && !paused){ idx++; speakNext(); } };
    speechSynthesis.speak(u);
    bar.style.width = Math.round((idx / speechItems.length) * 100) + "%";
    status.textContent = "再生中 " + (idx+1) + " / " + speechItems.length;
    stopTimers();
    tickTimer = setInterval(function(){
      if(myUid !== uid || !playing){ stopTimers(); return; }
      if(!speechSynthesis.speaking && !speechSynthesis.pending && !paused){ idx++; speakNext(); }
    }, 4000);
  }
  playBtn.addEventListener("click", function(){
    if(!("speechSynthesis" in window)){ status.textContent = "このブラウザでは音声合成が使えません"; return; }
    if(playing && !paused){
      paused = true; uid++; speechSynthesis.cancel(); stopTimers();
      playBtn.textContent = "▶ 再開";
      status.textContent = "一時停止中 " + (idx+1) + " 件目";
      return;
    }
    if(paused){
      paused = false; playing = true;
      playBtn.textContent = "⏸ 一時停止";
      speakNext();
      return;
    }
    playing = true; paused = false; idx = 0;
    playBtn.textContent = "⏸ 一時停止";
    speakNext();
  });
  stopBtn.addEventListener("click", reset);
  btn.addEventListener("click", function(){
    var show = !panel.classList.contains("show");
    panel.classList.toggle("show", show);
    if(show) build(); else reset();
  });
})();

/* ================= 図解ギャラリー ================= */
(function(){
  var btn = document.getElementById("galleryBtn");
  var panel = document.getElementById("galleryPanel");
  var body = document.getElementById("galleryBody");
  var built = false;
  btn.addEventListener("click", function(){
    var show = !panel.classList.contains("show");
    panel.classList.toggle("show", show);
    if(show && !built){
      built = true;
      if(typeof ALL_LESSONS === "undefined"){ body.innerHTML = "<p>データがありません。</p>"; return; }
      var html = "";
      ALL_LESSONS.forEach(function(L){
        if(L.diagram){
          html += '<div class="galItem"><p class="gtitle">第' + L.no + '課 ' + L.title + '</p>' + L.diagram + '</div>';
        }
      });
      body.innerHTML = html || "<p>図解がありません。</p>";
    }
  });
})();
</script>
</body>
